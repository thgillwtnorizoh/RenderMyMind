name: Android build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
      TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
      TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
      TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Stage debug-signed APK
        shell: bash
        run: |
          mkdir -p ci-artifacts
          short_sha="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "ci-artifacts/RenderMyMind-debug-${short_sha}.apk"

      - name: Decode stable test keystore
        if: >-
          ${{ env.TEST_KEYSTORE_BASE64 != '' &&
              env.TEST_KEY_ALIAS != '' &&
              env.TEST_KEYSTORE_PASSWORD != '' &&
              env.TEST_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/rendermymind-test.jks"

      - name: Sign release APK with stable test key
        if: >-
          ${{ env.TEST_KEYSTORE_BASE64 != '' &&
              env.TEST_KEY_ALIAS != '' &&
              env.TEST_KEYSTORE_PASSWORD != '' &&
              env.TEST_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail

          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/RenderMyMind-release-aligned.apk"
          short_sha="${GITHUB_SHA::7}"
          signed="ci-artifacts/RenderMyMind-release-test-signed-${short_sha}.apk"

          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [[ -z "$zipalign" || -z "$apksigner" ]]; then
            echo "Could not locate zipalign/apksigner in Android build-tools."
            exit 1
          fi

          "$zipalign" -f -p 4 "$unsigned" "$aligned"

          "$apksigner" sign \
            --ks "$RUNNER_TEMP/rendermymind-test.jks" \
            --ks-key-alias "$TEST_KEY_ALIAS" \
            --ks-pass "pass:$TEST_KEYSTORE_PASSWORD" \
            --key-pass "pass:$TEST_KEY_PASSWORD" \
            --out "$signed" \
            "$aligned"

          "$apksigner" verify --verbose --print-certs "$signed"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RenderMyMind-debug-${{ github.sha }}
          path: ci-artifacts/RenderMyMind-debug-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload stable test-signed release APK
        if: >-
          ${{ env.TEST_KEYSTORE_BASE64 != '' &&
              env.TEST_KEY_ALIAS != '' &&
              env.TEST_KEYSTORE_PASSWORD != '' &&
              env.TEST_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RenderMyMind-release-test-signed-${{ github.sha }}
          path: ci-artifacts/RenderMyMind-release-test-signed-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain signing mode
        if: >-
          ${{ env.TEST_KEYSTORE_BASE64 == '' ||
              env.TEST_KEY_ALIAS == '' ||
              env.TEST_KEYSTORE_PASSWORD == '' ||
              env.TEST_KEY_PASSWORD == '' }}
        run: |
          echo "::notice::Stable test-signing secrets are not configured."
          echo "::notice::The debug artifact is still Android-debug-signed and installable."
          echo "::notice::Add TEST_KEYSTORE_BASE64, TEST_KEY_ALIAS, TEST_KEYSTORE_PASSWORD, and TEST_KEY_PASSWORD for a reusable release test signature."
